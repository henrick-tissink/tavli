# Coolify deployment — web (Next.js) + worker (pg-boss) from ONE Dockerfile.
#
# In Coolify: New Resource → Docker Compose → point at this file. Set every
# ${VAR} in Coolify's Environment Variables UI (Coolify substitutes them here).
# NEXT_PUBLIC_* are BUILD-TIME (baked into the client bundle) → they live under
# build.args and require a rebuild when changed. DEMO_MODE is intentionally NOT
# set → the site is indexable (prod). Assign the tavli.ro domain to the `web`
# service in the Coolify UI (SERVICE_FQDN_WEB_3000 exposes it on port 3000).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_USE_DB=${NEXT_PUBLIC_USE_DB}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
        - NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    environment:
      # Coolify magic: exposes this service on port 3000 + provisions TLS. Set the
      # actual domain (https://tavli.ro) on the web service in the Coolify UI.
      - SERVICE_FQDN_WEB_3000
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - LINK_TRACKING_SECRET=${LINK_TRACKING_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - IMPERSONATION_COOKIE_SECRET=${IMPERSONATION_COOKIE_SECRET}
      - PARTNER_SIGNUP_ENABLED=${PARTNER_SIGNUP_ENABLED}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_BASE_MONTHLY=${STRIPE_PRICE_BASE_MONTHLY}
      - STRIPE_PRICE_BASE_ANNUAL=${STRIPE_PRICE_BASE_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - STRIPE_PRICE_EXTRA_LOCATION_MONTHLY=${STRIPE_PRICE_EXTRA_LOCATION_MONTHLY}
      - STRIPE_PRICE_EXTRA_LOCATION_ANNUAL=${STRIPE_PRICE_EXTRA_LOCATION_ANNUAL}
      - STRIPE_PRICE_SMS_OVERAGE=${STRIPE_PRICE_SMS_OVERAGE}
      - STRIPE_PRICE_WHATSAPP_OVERAGE=${STRIPE_PRICE_WHATSAPP_OVERAGE}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - WORKER_MODE=true
      - OTEL_SERVICE_NAME=tavli-worker
      # pg-boss REQUIRES the session pooler (:5432) for LISTEN/NOTIFY — never :6543.
      - PGBOSS_DATABASE_URL=${PGBOSS_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - EMAIL_FROM=${EMAIL_FROM}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - LINK_TRACKING_SECRET=${LINK_TRACKING_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_BASE_MONTHLY=${STRIPE_PRICE_BASE_MONTHLY}
      - STRIPE_PRICE_BASE_ANNUAL=${STRIPE_PRICE_BASE_ANNUAL}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - STRIPE_PRICE_EXTRA_LOCATION_MONTHLY=${STRIPE_PRICE_EXTRA_LOCATION_MONTHLY}
      - STRIPE_PRICE_EXTRA_LOCATION_ANNUAL=${STRIPE_PRICE_EXTRA_LOCATION_ANNUAL}
      - STRIPE_PRICE_SMS_OVERAGE=${STRIPE_PRICE_SMS_OVERAGE}
      - STRIPE_PRICE_WHATSAPP_OVERAGE=${STRIPE_PRICE_WHATSAPP_OVERAGE}
    restart: unless-stopped
